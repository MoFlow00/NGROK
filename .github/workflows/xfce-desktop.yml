name: Cloud Desktop XFCE4 (Fast Boot)

on:
  workflow_dispatch:

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Downloads Directory
        run: |
          mkdir -p /home/runner/Downloads
          chmod 777 /home/runner/Downloads

      - name: Run Web Desktop XFCE + Chrome (Kasm/Webtop)
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          docker run -d \
            --name=xfce-desktop \
            --privileged \
            -p 3000:3000 \
            -v /home/runner/Downloads:/config/Downloads \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:3000 --logfile desktop_tunnel.log &
          sleep 10

          DESKTOP_URL=$(grep -o 'https://.*\.trycloudflare\.com' desktop_tunnel.log | head -n 1)

          # إرسال الرابط للداشبورد مباشرة
          echo "::notice title=DESKTOP_URL::$DESKTOP_URL"

          echo "================================================="
          echo "DESKTOP_URL: $DESKTOP_URL"
          echo "================================================="
          sleep 21600
