name: Cloud Desktop

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "مدة الجلسة"
        required: true
        type: choice
        options: ["1h", "3h", "5h"]
        default: "3h"
      resolution:
        description: "دقة الشاشة"
        required: true
        type: choice
        options: ["1280x720", "1600x900", "1920x1080"]
        default: "1600x900"

permissions:
  contents: read

jobs:
  desktop:
    name: Openbox Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DISPLAY: ":99"

    steps:
      - name: Install minimal desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils x11vnc openbox tint2 xterm \
            novnc python3-websockify curl ca-certificates

          sudo curl -fsSL \
            -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Start desktop and VNC
        shell: bash
        env:
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -Eeuo pipefail

          Xvfb "$DISPLAY" -screen 0 "${RESOLUTION}x24" -nolisten tcp \
            > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xvfb.pid"

          for i in {1..20}; do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display "$DISPLAY" >/dev/null

          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          tint2 > "$RUNNER_TEMP/tint2.log" 2>&1 &
          xterm -fa Monospace -fs 11 -geometry 110x32+30+60 &

          VNC_PASS="$(openssl rand -hex 4)"
          echo "::add-mask::$VNC_PASS"

          x11vnc -display "$DISPLAY" \
            -passwd "$VNC_PASS" \
            -rfbport 5900 -localhost -forever -shared \
            -noxdamage -quiet \
            > "$RUNNER_TEMP/x11vnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/x11vnc.pid"

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5900 >/dev/null 2>&1; then break; fi
            if nc -z 127.0.0.1 5900; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 5900

          echo "VNC_PASS=$VNC_PASS" >> "$GITHUB_ENV"

      - name: Start noVNC
        shell: bash
        run: |
          set -Eeuo pipefail

          NOVNC_DIR="/usr/share/novnc"
          test -f "$NOVNC_DIR/vnc.html"

          websockify --web "$NOVNC_DIR" 6080 127.0.0.1:5900 \
            > "$RUNNER_TEMP/websockify.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/websockify.pid"

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null

      - name: Open temporary tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          cloudflared tunnel --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          PUBLIC_URL=""
          for i in {1..60}; do
            PUBLIC_URL="$(
              grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                "$RUNNER_TEMP/cloudflared.log" | head -n1 || true
            )"
            if [[ -n "$PUBLIC_URL" ]]; then break; fi
            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::لم يتم العثور على رابط النفق."
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          for i in {1..20}; do
            if curl -fsS --max-time 10 "$PUBLIC_URL/vnc.html" >/dev/null; then
              break
            fi
            sleep 3
          done
          curl -fsS --max-time 10 "$PUBLIC_URL/vnc.html" >/dev/null

          echo "::add-mask::$PUBLIC_URL"
          echo "رابط noVNC: $PUBLIC_URL/vnc.html"
          echo "كلمة مرور VNC موجودة في متغيرات بيئة الخطوات، ولا تُطبع في السجل."
          echo "افتح الرابط وأدخل كلمة المرور: $VNC_PASS"

      - name: Keep session alive
        shell: bash
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          case "$DURATION" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            5h) sleep 18000 ;;
            *) echo "::error::مدة غير صالحة"; exit 1 ;;
          esac

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP"/*.pid; do
            [[ -f "$file" ]] || continue
            kill "$(cat "$file")" 2>/dev/null || true
          done
          pkill -x cloudflared 2>/dev/null || true
          pkill -x websockify 2>/dev/null || true
          pkill -x x11vnc 2>/dev/null || true
          pkill -x tint2 2>/dev/null || true
          pkill -x openbox 2>/dev/null || true
          pkill -x Xvfb 2>/dev/null || true
