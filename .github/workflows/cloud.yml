name: NGROK Cloud

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: true
        type: choice
        options:
          - "1h"
          - "3h"
          - "6h"
        default: "6h"

permissions:
  contents: read

jobs:
  desktop:
    name: Selkies XFCE4
    runs-on: ubuntu-latest
    timeout-minutes: 365

    steps:
      - name: Install lightweight desktop
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends             xfce4             xfce4-terminal             curl             ca-certificates             pulseaudio

          SELKIES_VERSION="2.0.0"

          . /etc/os-release
          DISTRO="${ID}${VERSION_ID}"
          ARCH="$(dpkg --print-architecture)"
          PKG="selkies-${SELKIES_VERSION}-${DISTRO}-${ARCH}.deb"

          curl -fsSL --retry 5 --retry-all-errors             -o "/tmp/${PKG}"             "https://github.com/selkies-project/selkies/releases/download/${SELKIES_VERSION}/${PKG}"

          sudo apt-get install -y "/tmp/${PKG}"

          curl -fsSL --retry 5 --retry-all-errors             -o "$HOME/cloudflared"             https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x "$HOME/cloudflared"

          selkies --help >/dev/null
          selkies-session --help >/dev/null

      - name: Start Selkies desktop
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.selkies/logs"

          PASSWORD="$(openssl rand -hex 12)"
          echo "$PASSWORD" > "$HOME/.selkies/password"

          rm -rf "$HOME/.config/xfce4"

          nohup selkies-session             --session=xfce             --public             --port=8080             --mode=websockets             --encoder=h264enc             --use-cpu=true             --enable-resize=true             --basic-auth-user=ubuntu             --basic-auth-password="$PASSWORD"             > "$HOME/.selkies/logs/selkies.log" 2>&1 &

          echo $! > "$HOME/.selkies/selkies.pid"

          for attempt in {1..60}; do
            if curl -fsS               -u "ubuntu:$PASSWORD"               --max-time 5               -o /dev/null               http://127.0.0.1:8080/; then
              break
            fi

            if ! kill -0 "$(cat "$HOME/.selkies/selkies.pid")" 2>/dev/null; then
              echo "::error::Selkies stopped."
              cat "$HOME/.selkies/logs/selkies.log" || true
              exit 1
            fi

            sleep 2
          done

          if ! curl -fsS             -u "ubuntu:$PASSWORD"             --max-time 5             -o /dev/null             http://127.0.0.1:8080/; then
            echo "::error::Selkies did not become ready."
            cat "$HOME/.selkies/logs/selkies.log" || true
            exit 1
          fi

          {
            echo "SELKIES_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Selkies desktop is ready."

      - name: Start Cloudflare Quick Tunnel
        run: |
          set -Eeuo pipefail

          "$HOME/cloudflared" tunnel             --no-autoupdate             --url http://127.0.0.1:8080             > "$HOME/.selkies/logs/cloudflared.log" 2>&1 &

          echo $! > "$HOME/.selkies/cloudflared.pid"

          PUBLIC_URL=""

          for attempt in {1..60}; do
            PUBLIC_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com'               "$HOME/.selkies/logs/cloudflared.log" | tail -n 1 || true)"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            if ! kill -0 "$(cat "$HOME/.selkies/cloudflared.pid")" 2>/dev/null; then
              echo "::error::Cloudflare Tunnel stopped."
              cat "$HOME/.selkies/logs/cloudflared.log" || true
              exit 1
            fi

            sleep 2
          done

          [[ -n "$PUBLIC_URL" ]] || {
            echo "::error::Cloudflare public URL was not created."
            cat "$HOME/.selkies/logs/cloudflared.log" || true
            exit 1
          }

          status="000"

          for attempt in {1..30}; do
            status="$(curl -sS               -u "ubuntu:$SELKIES_PASSWORD"               --max-time 10               -o /dev/null               -w "%{http_code}"               "$PUBLIC_URL/" 2>/dev/null || true)"

            if [[ "$status" == "200" ]]; then
              break
            fi

            sleep 2
          done

          if [[ "$status" != "200" ]]; then
            echo "::error::Public Selkies URL did not respond."
            cat "$HOME/.selkies/logs/cloudflared.log" || true
            exit 1
          fi

          {
            echo "========================================"
            echo "NGROK CLOUD IS READY"
            echo "========================================"
            echo "Project     : Selkies"
            echo "Linux       : Ubuntu"
            echo "Desktop     : XFCE4"
            echo "Transport   : Selkies WebSocket"
            echo "Encoder     : H.264 software"
            echo "Resolution  : Dynamic / browser fitted"
            echo "Status      : ONLINE"
            echo
            echo "Public URL  : $PUBLIC_URL/"
            echo "Username    : ubuntu"
            echo "Password    : $SELKIES_PASSWORD"
            echo
            echo "Open the URL and use the fullscreen button."
            echo "========================================"
          } | tee /tmp/connection.txt

          {
            echo "### NGROK CLOUD"
            cat /tmp/connection.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        run: |
          case "${{ inputs.duration }}" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            6h) sleep 21600 ;;
            *) echo "::error::Invalid duration"; exit 1 ;;
          esac

      - name: Diagnostics
        if: failure()
        run: |
          ps aux | grep -E 'selkies|xfce|Xvfb|pulseaudio|cloudflared' | grep -v grep || true
          cat "$HOME/.selkies/logs/selkies.log" 2>/dev/null || true
          cat "$HOME/.selkies/logs/cloudflared.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f selkies-session >/dev/null 2>&1 || true
          pkill -f selkies >/dev/null 2>&1 || true
          pkill -f xfce4 >/dev/null 2>&1 || true
          pkill -f Xvfb >/dev/null 2>&1 || true
          pkill -f pulseaudio >/dev/null 2>&1 || true
          pkill -f cloudflared >/dev/null 2>&1 || true
