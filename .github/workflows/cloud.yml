name: NGROK Cloud

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: true
        type: choice
        options:
          - "1h"
          - "3h"
          - "6h"
        default: "6h"

permissions:
  contents: read

jobs:
  desktop:
    name: Selkies XFCE4 WebRTC
    runs-on: ubuntu-latest
    timeout-minutes: 365

    steps:
      - name: Install lightweight desktop
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            curl \
            ca-certificates \
            pulseaudio \
            openssl \
            jq

          SELKIES_VERSION="2.0.0"

          . /etc/os-release
          DISTRO="${ID}${VERSION_ID}"
          ARCH="$(dpkg --print-architecture)"
          PKG="selkies-${SELKIES_VERSION}-${DISTRO}-${ARCH}.deb"

          curl -fsSL --retry 5 --retry-all-errors \
            -o "/tmp/${PKG}" \
            "https://github.com/selkies-project/selkies/releases/download/${SELKIES_VERSION}/${PKG}"

          sudo apt-get install -y "/tmp/${PKG}"

          # Selkies 2.0.0 uses the old Cloudflare TURN credential endpoint.
          # Cloudflare now serves this endpoint as /generate-ice-servers.
          # Patch the installed module so WebRTC TURN works with the current API.
          SELKIES_ICE_CONFIG="$(python3 - <<'PY'
import pathlib
import selkies.webrtc_ice_config as m
print(pathlib.Path(m.__file__))
PY
)"
          sudo sed -i \
            's#https://rtc.live.cloudflare.com/v1/turn/keys/{turn_token_id}/credentials/generate"#https://rtc.live.cloudflare.com/v1/turn/keys/{turn_token_id}/credentials/generate-ice-servers"#' \
            "$SELKIES_ICE_CONFIG"

          curl -fsSL --retry 5 --retry-all-errors \
            -o "$HOME/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"

          chmod +x "$HOME/cloudflared"

          selkies --help >/dev/null
          selkies-session --help >/dev/null

      - name: Create temporary Cloudflare TURN key
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_API_TOKEN" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN repository secrets."
            echo "::error::WebRTC needs Cloudflare Calls TURN for the GitHub-hosted runner."
            echo "::error::The API token needs Calls Write permission."
            exit 1
          fi

          TURN_RESPONSE="$(curl -fsS --retry 5 --retry-all-errors \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/calls/turn_keys" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"NGROK ephemeral WebRTC"}')"

          if [[ "$(jq -r '.success' <<<"$TURN_RESPONSE")" != "true" ]]; then
            echo "::error::Cloudflare TURN key creation failed."
            jq -c '.errors' <<<"$TURN_RESPONSE" || true
            exit 1
          fi

          TURN_KEY_ID="$(jq -r '.result.uid' <<<"$TURN_RESPONSE")"

          if [[ -z "$TURN_KEY_ID" || "$TURN_KEY_ID" == "null" ]]; then
            echo "::error::Cloudflare did not return a TURN key ID."
            exit 1
          fi

          {
            echo "CF_ACCOUNT_ID=$CF_ACCOUNT_ID"
            echo "TURN_KEY_ID=$TURN_KEY_ID"
            echo "CF_API_TOKEN=$CF_API_TOKEN"
          } >> "$GITHUB_ENV"

          echo "Cloudflare TURN key created for this session."

      - name: Start Selkies desktop
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.selkies/logs"

          PASSWORD="$(openssl rand -hex 12)"
          echo "$PASSWORD" > "$HOME/.selkies/password"

          rm -rf "$HOME/.config/xfce4"

          nohup selkies-session \
            --session=xfce \
            --public \
            --port=8080 \
            --mode=webrtc \
            --enable-dual-mode=true \
            --enable-cloudflare-turn=true \
            --cloudflare-turn-token-id="$TURN_KEY_ID" \
            --cloudflare-turn-api-token="$CF_API_TOKEN" \
            --encoder=h264enc \
            --use-cpu=true \
            --enable-resize=true \
            --basic-auth-user=ubuntu \
            --basic-auth-password="$PASSWORD" \
            > "$HOME/.selkies/logs/selkies.log" 2>&1 &

          echo $! > "$HOME/.selkies/selkies.pid"

          for attempt in {1..60}; do
            if curl -fsS \
              -u "ubuntu:$PASSWORD" \
              --max-time 5 \
              -o /dev/null \
              http://127.0.0.1:8080/; then
              break
            fi

            if ! kill -0 "$(cat "$HOME/.selkies/selkies.pid")" 2>/dev/null; then
              echo "::error::Selkies stopped."
              cat "$HOME/.selkies/logs/selkies.log" || true
              exit 1
            fi

            sleep 2
          done

          if ! curl -fsS \
            -u "ubuntu:$PASSWORD" \
            --max-time 5 \
            -o /dev/null \
            http://127.0.0.1:8080/; then
            echo "::error::Selkies did not become ready."
            cat "$HOME/.selkies/logs/selkies.log" || true
            exit 1
          fi

          {
            echo "SELKIES_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Selkies WebRTC desktop is ready."

      - name: Start Cloudflare Quick Tunnel for signaling
        run: |
          set -Eeuo pipefail

          "$HOME/cloudflared" tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > "$HOME/.selkies/logs/cloudflared.log" 2>&1 &

          echo $! > "$HOME/.selkies/cloudflared.pid"

          PUBLIC_URL=""

          for attempt in {1..60}; do
            # cloudflared can emit the Quick Tunnel URL with terminal formatting or
            # as a markdown-style link. Strip formatting first, then extract only
            # the hostname so the readiness check is not dependent on log styling.
            CLEAN_LOG="$(sed -E $'s/\\x1B\\[[0-9;?]*[ -/]*[@-~]//g' \
              "$HOME/.selkies/logs/cloudflared.log" 2>/dev/null || true)"

            PUBLIC_URL="$(printf '%s\\n' "$CLEAN_LOG" \
              | grep -aEo 'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
              | tail -n 1 || true)"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            if ! kill -0 "$(cat "$HOME/.selkies/cloudflared.pid")" 2>/dev/null; then
              echo "::error::Cloudflare Tunnel stopped."
              cat "$HOME/.selkies/logs/cloudflared.log" || true
              exit 1
            fi

            sleep 2
          done

          [[ -n "$PUBLIC_URL" ]] || {
            echo "::error::Cloudflare public URL was not created."
            cat "$HOME/.selkies/logs/cloudflared.log" || true
            exit 1
          }

          status="000"

          for attempt in {1..30}; do
            status="$(curl -sS \
              -u "ubuntu:$SELKIES_PASSWORD" \
              --max-time 10 \
              -o /dev/null \
              -w "%{http_code}" \
              "$PUBLIC_URL/" 2>/dev/null || true)"

            if [[ "$status" == "200" ]]; then
              break
            fi

            sleep 2
          done

          if [[ "$status" != "200" ]]; then
            echo "::error::Public Selkies URL did not respond."
            cat "$HOME/.selkies/logs/cloudflared.log" || true
            exit 1
          fi

          {
            echo "========================================"
            echo "NGROK CLOUD IS READY"
            echo "========================================"
            echo "Project     : Selkies"
            echo "Linux       : Ubuntu"
            echo "Desktop     : XFCE4"
            echo "Transport   : WebRTC"
            echo "Media Relay : Cloudflare Calls TURN"
            echo "Encoder     : H.264 software"
            echo "Resolution  : Dynamic / browser fitted"
            echo "Status      : ONLINE"
            echo
            echo "Public URL  : $PUBLIC_URL/"
            echo "Username    : ubuntu"
            echo "Password    : $SELKIES_PASSWORD"
            echo
            echo "Open the URL. WebRTC is the default transport."
            echo "WebSocket fallback is available from the Selkies menu."
            echo "========================================"
          } | tee /tmp/connection.txt

          {
            echo "### NGROK CLOUD"
            cat /tmp/connection.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        run: |
          case "${{ inputs.duration }}" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            6h) sleep 21600 ;;
            *) echo "::error::Invalid duration"; exit 1 ;;
          esac

      - name: Diagnostics
        if: failure()
        run: |
          ps aux | grep -E 'selkies|xfce|Xvfb|pulseaudio|cloudflared' | grep -v grep || true
          cat "$HOME/.selkies/logs/selkies.log" 2>/dev/null || true
          cat "$HOME/.selkies/logs/cloudflared.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          if [[ -n "${TURN_KEY_ID:-}" && -n "${CF_ACCOUNT_ID:-}" && -n "${CF_API_TOKEN:-}" ]]; then
            curl -fsS --retry 3 \
              -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/calls/turn_keys/${TURN_KEY_ID}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -o /dev/null || true
          fi

          pkill -f selkies-session >/dev/null 2>&1 || true
          pkill -f selkies >/dev/null 2>&1 || true
          pkill -f xfce4 >/dev/null 2>&1 || true
          pkill -f Xvfb >/dev/null 2>&1 || true
          pkill -f pulseaudio >/dev/null 2>&1 || true
          pkill -f cloudflared >/dev/null 2>&1 || true
