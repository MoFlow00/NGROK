name: NGROK Cloud

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: true
        type: choice
        options:
          - "1h"
          - "3h"
          - "6h"
        default: "6h"

permissions:
  contents: read

jobs:
  desktop:
    name: Lightweight XFCE4 Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 365

    steps:
      - name: Start Linux Desktop
        run: |
          set -Eeuo pipefail
          docker pull theholm/xfce4-desktop-over-http:latest
          docker rm -f ngrok-cloud >/dev/null 2>&1 || true
          docker run -d \
            --name ngrok-cloud \
            --shm-size=512m \
            -p 6080:6080 \
            -e XRES=1366x768x24 \
            -e TZ=Asia/Dubai \
            theholm/xfce4-desktop-over-http:latest

          echo "Waiting for XFCE4 desktop..."
          for attempt in {1..60}; do
            status="$(curl -sS --max-time 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:6080/ 2>/dev/null || true)"
            if [[ "$status" == "200" ]]; then
              echo "XFCE4 desktop is ready."
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' ngrok-cloud 2>/dev/null | grep -q true; then
              echo "::error::Desktop container stopped."
              docker logs ngrok-cloud || true
              exit 1
            fi
            sleep 2
          done

          echo "::error::XFCE4 desktop did not become ready."
          docker logs ngrok-cloud --tail 200 || true
          exit 1

      - name: Start Cloudflare Quick Tunnel
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          PUBLIC_URL=""
          for attempt in {1..60}; do
            PUBLIC_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -n 1 || true)"
            if [[ -n "$PUBLIC_URL" ]]; then break; fi
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "::error::Cloudflare Tunnel stopped."
              cat /tmp/cloudflared.log || true
              exit 1
            fi
            sleep 2
          done

          [[ -n "$PUBLIC_URL" ]] || {
            echo "::error::Cloudflare public URL was not created."
            cat /tmp/cloudflared.log || true
            exit 1
          }

          for attempt in {1..30}; do
            status="$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" "$PUBLIC_URL/" 2>/dev/null || true)"
            if [[ "$status" == "200" ]]; then break; fi
            sleep 2
          done

          if [[ "$status" != "200" ]]; then
            echo "::error::Public desktop did not respond."
            cat /tmp/cloudflared.log || true
            exit 1
          fi

          {
            echo "========================================"
            echo "NGROK CLOUD IS READY"
            echo "========================================"
            echo "Linux       : Debian"
            echo "Desktop     : XFCE4"
            echo "Browser     : Chromium installed"
            echo "Resolution  : 1366x768"
            echo "Display     : noVNC"
            echo "Status      : ONLINE"
            echo
            echo "Public URL  : $PUBLIC_URL"
            echo
            echo "Open the URL to use the full Linux desktop."
            echo "========================================"
          } | tee /tmp/connection.txt

          {
            echo "### NGROK CLOUD"
            cat /tmp/connection.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        run: |
          case "${{ inputs.duration }}" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            6h) sleep 21600 ;;
            *) echo "::error::Invalid duration"; exit 1 ;;
          esac

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker logs ngrok-cloud --tail 300 2>/dev/null || true
          cat /tmp/cloudflared.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ngrok-cloud >/dev/null 2>&1 || true
          if [[ -f /tmp/cloudflared.pid ]]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi
