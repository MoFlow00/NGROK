name: High-Performance Gaming Desktop (WebRTC & Wine)

on:
  workflow_dispatch:

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Kasm Gaming Desktop
        env:
          VNC_PW: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          PASS="${VNC_PW:-retro12345}"

          # 1. تشغيل حاوية Kasm
          docker run -d \
            --name=kasm-desktop \
            --privileged \
            --shm-size=2gb \
            -p 6901:6901 \
            -e VNC_PW="$PASS" \
            kasmweb/ubuntu-jammy-desktop:1.15.0

          echo "Configuring Gaming Environment & Wine..."
          sleep 5

          # 2. إعداد الصلاحيات، تثبيت Wine، وأزرار الطوارئ
          docker exec -u 0 kasm-desktop bash -c "
            echo 'ALL ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
            rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google.list 2>/dev/null || true &&
            dpkg --add-architecture i386 &&
            apt-get update -y &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y wine wine32 wine64 p7zip-full xdotool xterm

            # زر طوارئ لإغلاق اللعبة المعلقة
            cat << 'EOF' > /home/kasm-user/Desktop/Kill_All_Games.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Force Kill Games
          Comment=Emergency exit for frozen games
          Exec=killall -9 wine wine64 wineserver YURI.exe RA2.EXE GAME.EXE
          Icon=process-stop
          Terminal=false
          Categories=Utility;
          EOF
            chmod +x /home/kasm-user/Desktop/Kill_All_Games.desktop
            chown kasm-user:kasm-user /home/kasm-user/Desktop/Kill_All_Games.desktop

            # سكربت تشغيل الألعاب داخل نافذة قابلة للتصغير والإغلاق
            cat << 'EOF' > /usr/local/bin/play-windowed
          #!/bin/bash
          wine explorer /desktop=Game,1024x768 \"\$@\"
          EOF
            chmod +x /usr/local/bin/play-windowed
          "

      - name: Start Multi-Protocol Tunnel
        run: |
          # تشغيل النفق مع توجيه مباشر للمخرجات
          cloudflared tunnel --no-tls-verify --url https://127.0.0.1:6901 > tunnel.log 2>&1 &

          echo "Connecting Tunnel..."
          DESKTOP_URL=""
          for i in {1..60}; do
            DESKTOP_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
            if [ -n "$DESKTOP_URL" ]; then
              echo "Desktop is ready!"
              break
            fi
            sleep 2
          done

          echo "================================================="
          echo "DESKTOP_URL: $DESKTOP_URL"
          echo "USERNAME:    kasm_user"
          echo "PASSWORD:    ${{ secrets.BROWSER_PASSWORD }}"
          echo "================================================="

          # طباعة أسطر التقرير للتأكد
          cat tunnel.log | grep -E 'trycloudflare|INF|ERR' | head -n 15

          sleep 21600
