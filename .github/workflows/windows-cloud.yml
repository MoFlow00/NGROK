name: Cloud Windows Lite (Fast & Stable)

on:
  workflow_dispatch:

jobs:
  run-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Fast Desktop with Wine
        run: |
          # تشغيل سطح مكتب خفيف جداً ومجهز بأدوات تشغيل الـ exe فوراً
          docker run -d \
            --name=fast-desktop \
            --privileged \
            --shm-size=2gb \
            -p 6080:80 \
            -e RESOLUTION=1280x720 \
            dorowu/ubuntu-desktop-lxde-vnc

          # تثبيت Wine لفتح ملفات exe بالدبل كليك
          docker exec fast-desktop bash -c "apt-get update && apt-get install -y wine" &

      - name: Start Cloudflare Tunnel & Verification
        run: |
          cloudflared tunnel --url http://127.0.0.1:6080 --logfile win_tunnel.log &

          echo "Waiting for Tunnel to generate URL..."
          WIN_URL=""
          for i in {1..30}; do
            WIN_URL=$(grep -o 'https://.*\.trycloudflare\.com' win_tunnel.log | head -n 1 || true)
            if [ -n "$WIN_URL" ]; then
              echo "Tunnel is ready!"
              break
            fi
            sleep 2
          done

          echo "::notice title=WINDOWS_URL::$WIN_URL"

          echo "================================================="
          echo "WINDOWS_URL: $WIN_URL"
          echo "================================================="
          sleep 21600
