name: Cloud Game Desktop

on:
  workflow_dispatch:

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Kasm Desktop
        env:
          VNC_PW: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          PASS="${VNC_PW:-retro12345}"
          docker run -d \
            --name=kasm-desktop \
            --privileged \
            --shm-size=2gb \
            -p 6901:6901 \
            -e VNC_PW="$PASS" \
            kasmweb/ubuntu-jammy-desktop:1.15.0
          sleep 12

      - name: Install Desktop Tools
        run: |
          docker exec -u 0 kasm-desktop bash -lc 'dpkg --add-architecture i386'
          docker exec -u 0 kasm-desktop bash -lc 'apt-get update'
          docker exec -u 0 kasm-desktop bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get install -y wine wine32 wine64 winetricks cabextract p7zip-full unzip unrar aria2 axel curl wget zenity xdotool vlc file xdg-utils'

      - name: Configure Wine And Game Folders
        run: |
          docker exec -u 0 kasm-desktop bash -lc 'mkdir -p /home/kasm-user/Downloads /home/kasm-user/Games /home/kasm-user/Desktop && chown -R kasm-user:kasm-user /home/kasm-user/Downloads /home/kasm-user/Games /home/kasm-user/Desktop'
          docker exec -u 1000 kasm-desktop bash -lc 'export DISPLAY=${DISPLAY:-:1}; export WINEPREFIX=/home/kasm-user/.wine; wineboot --init || true'

      - name: Install Official WinRAR
        run: |
          docker exec -u 1000 kasm-desktop bash -lc 'export DISPLAY=${DISPLAY:-:1}; export WINEPREFIX=/home/kasm-user/.wine; cd /home/kasm-user/Downloads; wget -q -O winrar-x64.exe https://www.rarlab.com/rar/winrar-x64-723.exe; wine winrar-x64.exe /s || true'

      - name: Create Fast Downloader
        run: |
          docker exec -u 0 kasm-desktop bash -lc 'cat > /usr/local/bin/fast-download <<"EOF"
#!/bin/bash
URL="$1"
[ -z "$URL" ] && exit 1
mkdir -p /home/kasm-user/Downloads
cd /home/kasm-user/Downloads
exec aria2c -x16 -s16 -k1M --file-allocation=none --summary-interval=1 "$URL"
EOF
chmod +x /usr/local/bin/fast-download'
          docker exec -u 0 kasm-desktop bash -lc 'cat > /usr/local/bin/download-url <<"EOF"
#!/bin/bash
URL=$(zenity --entry --title="Fast Downloader" --text="Paste a direct download URL") || exit 0
[ -z "$URL" ] && exit 0
fast-download "$URL"
zenity --info --title="Download complete" --text="The file is in Downloads." || true
EOF
chmod +x /usr/local/bin/download-url'

      - name: Configure EXE Double Click
        run: |
          docker exec -u 0 kasm-desktop bash -lc 'mkdir -p /home/kasm-user/.local/share/applications'
          docker exec -u 0 kasm-desktop bash -lc 'cat > /home/kasm-user/.local/share/applications/wine-exe.desktop <<"EOF"
[Desktop Entry]
Name=Windows EXE
Comment=Run Windows programs with Wine
Exec=run-exe %f
Type=Application
Terminal=false
NoDisplay=true
MimeType=application/x-ms-dos-executable;application/x-msdownload;application/x-msi;
EOF
cat > /usr/local/bin/run-exe <<"EOF"
#!/bin/bash
FILE="$1"
[ -z "$FILE" ] && exit 1
export WINEPREFIX=/home/kasm-user/.wine
cd "$(dirname "$FILE")"
exec wine "$FILE"
EOF
chmod +x /usr/local/bin/run-exe
chown -R kasm-user:kasm-user /home/kasm-user/.local'
          docker exec -u 1000 kasm-desktop bash -lc 'update-desktop-database /home/kasm-user/.local/share/applications 2>/dev/null || true; xdg-mime default wine-exe.desktop application/x-ms-dos-executable 2>/dev/null || true; xdg-mime default wine-exe.desktop application/x-msdownload 2>/dev/null || true; xdg-mime default wine-exe.desktop application/x-msi 2>/dev/null || true'

      - name: Create Game Hub And Shortcuts
        run: |
          docker exec -u 0 kasm-desktop bash -lc 'cat > /usr/local/bin/game-hub <<"EOF"
#!/bin/bash
CHOICE=$(zenity --list --title="Game Hub" --text="Choose what you want" --radiolist --height=360 --width=520 --column="" --column="Action" TRUE "Fast Download" FALSE "Open Downloads" FALSE "Open Games" FALSE "Open Internet Archive Software" FALSE "Open MyAbandonware") || exit 0
case "$CHOICE" in
  "Fast Download") download-url ;;
  "Open Downloads") xdg-open /home/kasm-user/Downloads ;;
  "Open Games") xdg-open /home/kasm-user/Games ;;
  "Open Internet Archive Software") xdg-open "https://archive.org/details/software" ;;
  "Open MyAbandonware") xdg-open "https://www.myabandonware.com/browse/platform/windows/" ;;
esac
EOF
chmod +x /usr/local/bin/game-hub'
          docker exec -u 0 kasm-desktop bash -lc 'cat > /home/kasm-user/Desktop/Game_Hub.desktop <<"EOF"
[Desktop Entry]
Type=Application
Name=Game Hub
Comment=Games, downloads and tools
Exec=game-hub
Icon=applications-games
Terminal=false
EOF
cat > /home/kasm-user/Desktop/Fast_Download.desktop <<"EOF"
[Desktop Entry]
Type=Application
Name=Fast Download
Exec=download-url
Icon=folder-download
Terminal=false
EOF
cat > /home/kasm-user/Desktop/Downloads.desktop <<"EOF"
[Desktop Entry]
Type=Application
Name=Downloads
Exec=xdg-open /home/kasm-user/Downloads
Icon=folder-download
Terminal=false
EOF
cat > /home/kasm-user/Desktop/Games.desktop <<"EOF"
[Desktop Entry]
Type=Application
Name=Games
Exec=xdg-open /home/kasm-user/Games
Icon=applications-games
Terminal=false
EOF
cat > /home/kasm-user/Desktop/WinRAR.desktop <<"EOF"
[Desktop Entry]
Type=Application
Name=WinRAR
Comment=WinRAR archive manager
Exec=wine /home/kasm-user/.wine/drive_c/Program\\ Files/WinRAR/WinRAR.exe
Icon=application-x-rar
Terminal=false
EOF
chmod +x /home/kasm-user/Desktop/*.desktop
chown -R kasm-user:kasm-user /home/kasm-user/Desktop'

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --no-tls-verify --url https://127.0.0.1:6901 > tunnel.log 2>&1 &
          for i in {1..60}; do
            DESKTOP_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | tail -n 1 || true)
            if [ -n "$DESKTOP_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$DESKTOP_URL" ]; then cat tunnel.log; exit 1; fi
          echo "================================================="
          echo "DESKTOP_URL: $DESKTOP_URL"
          echo "USERNAME:    kasm_user"
          echo "PASSWORD:    ${{ secrets.BROWSER_PASSWORD }}"
          echo "================================================="

      - name: Keep Session Alive
        run: sleep 21600
