name: Cloud Retro Gaming (RustDesk Fast Desktop)

on:
  workflow_dispatch:

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Enable 32-bit Architecture & Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          # تثبيت الحزم الناقصة libxdo3 و dbus-x11 لحل أخطاء librustdesk.so
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-terminal xvfb dbus-x11 libxdo3 libxfixes3 libxrandr2 \
            wine wine32 wine64 winetricks wget curl jq

      - name: Install RustDesk
        run: |
          wget -q -O rustdesk.deb https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb
          sudo dpkg -i rustdesk.deb || sudo apt-get -f install -y

      - name: Start Virtual Display & RustDesk Service
        env:
          CUSTOM_PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # 1. تشغيل الشاشة الافتراضية
          Xvfb :1 -screen 0 1280x720x24 &
          export DISPLAY=:1
          sleep 2

          # 2. تشغيل واجهة XFCE مع جلسة D-Bus نشطة
          dbus-launch --exit-with-session startxfce4 &
          sleep 4

          # 3. ضبط كلمة مرور الاتصال
          PASS="${CUSTOM_PASSWORD:-retro12345}"
          rustdesk --password "$PASS"

          # 4. تشغيل RustDesk داخل نفس جلسة الشاشة
          rustdesk --service &
          sleep 6

          # 5. استخراج الـ ID الصحيح
          RUSTDESK_ID=$(rustdesk --get-id || true)
          if [ -z "$RUSTDESK_ID" ]; then
            RUSTDESK_ID=$(grep -oP '(?<=id: ).*' ~/.config/rustdesk/RustDesk.toml 2>/dev/null || grep -oP '(?<=id: ).*' /etc/rustdesk/rustdesk.toml 2>/dev/null || true)
          fi

          echo "::notice title=RUSTDESK_ID::$RUSTDESK_ID"
          echo "::notice title=RUSTDESK_PASSWORD::$PASS"

          echo "================================================="
          echo "RUSTDESK ID: $RUSTDESK_ID"
          echo "PASSWORD:    $PASS"
          echo "================================================="

          sleep 21600
