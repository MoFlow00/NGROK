name: Cloud Retro Gaming (RustDesk Fast Desktop)

on:
  workflow_dispatch:

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Enable 32-bit Architecture & Install Wine & Desktop
        run: |
          # 1. تفعيل معمارية i386 لتثبيت دعم ألعاب 32-bit القديمة
          sudo dpkg --add-architecture i386
          sudo apt-get update

          # 2. تثبيت واجهة XFCE ومحرك تشغيل ألعاب الويندوز Wine
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-terminal xvfb pulseaudio \
            wine wine32 wine64 winetricks wget curl jq

      - name: Install RustDesk
        run: |
          # تنزيل حزمة deb الرسمية لـ RustDesk وتثبيتها
          wget -q -O rustdesk.deb https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb || \
          wget -q -O rustdesk.deb $(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '.assets[] | select(.name | endswith("x86_64.deb")) | .browser_download_url' | head -n 1)
          sudo dpkg -i --force-depends rustdesk.deb || sudo apt-get -f install -y

      - name: Start Virtual Display & RustDesk Service
        env:
          CUSTOM_PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # 1. تشغيل الشاشة الافتراضية
          Xvfb :1 -screen 0 1280x720x24 &
          export DISPLAY=:1
          sleep 2

          # 2. تشغيل واجهة الديسكتوب الخفيفة
          startxfce4 &
          sleep 3

          # 3. ضبط كلمة مرور الاتصال
          PASS="${CUSTOM_PASSWORD:-retro12345}"
          sudo rustdesk --password "$PASS"

          # 4. تشغيل خدمة RustDesk واستخراج معرف الاتصال ID
          sudo rustdesk --service &
          sleep 6

          RUSTDESK_ID=$(rustdesk --get-id)

          echo "::notice title=RUSTDESK_ID::$RUSTDESK_ID"
          echo "::notice title=RUSTDESK_PASSWORD::$PASS"

          echo "================================================="
          echo "RUSTDESK ID: $RUSTDESK_ID"
          echo "PASSWORD:    $PASS"
          echo "================================================="

          # إبقاء السيرفر نشطاً لمدة 6 ساعات
          sleep 21600
