name: High-Performance Gaming Desktop (WebRTC & Wine)

on:
  workflow_dispatch:

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Kasm Gaming Desktop
        env:
          VNC_PW: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          PASS="${VNC_PW:-retro12345}"

          # 1. تشغيل حاوية Kasm
          docker run -d \
            --name=kasm-desktop \
            --privileged \
            --shm-size=2gb \
            -p 6901:6901 \
            -e VNC_PW="$PASS" \
            kasmweb/ubuntu-jammy-desktop:1.15.0

          echo "Configuring Gaming Environment & Emergency Shortcuts..."
          sleep 5

          # 2. إعداد الصلاحيات، تثبيت Wine، معالجات العرض وأزرار الطوارئ
          docker exec -u 0 kasm-desktop bash -c "
            echo 'ALL ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
            rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google.list 2>/dev/null || true &&
            dpkg --add-architecture i386 &&
            apt-get update -y &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y wine wine32 wine64 p7zip-full xdotool xterm

            # إنشاء زر طوارئ على سطح المكتب لإنهاء الألعاب المعلقة
            cat << 'EOF' > /home/kasm-user/Desktop/Kill_All_Games.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Force Kill Games
          Comment=Emergency exit for frozen games
          Exec=killall -9 wine wine64 wineserver YURI.exe RA2.EXE GAME.EXE
          Icon=process-stop
          Terminal=false
          Categories=Utility;
          EOF
            chmod +x /home/kasm-user/Desktop/Kill_All_Games.desktop
            chown kasm-user:kasm-user /home/kasm-user/Desktop/Kill_All_Games.desktop

            # إنشاء سكربت تشغيل آمن داخل نافذة محددة الأبعاد (Virtual Desktop)
            cat << 'EOF' > /usr/local/bin/play-windowed
          #!/bin/bash
          wine explorer /desktop=Game,1024x768 \"\$@\"
          EOF
            chmod +x /usr/local/bin/play-windowed
          "

      - name: Start Stable Cloudflare Tunnel
        run: |
          cloudflared tunnel --protocol http2 --no-tls-verify --url https://127.0.0.1:6901 --logfile gaming_tunnel.log &

          echo "Waiting for WebRTC Desktop Tunnel..."
          DESKTOP_URL=""
          for i in {1..40}; do
            DESKTOP_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1 || true)
            if [ -n "$DESKTOP_URL" ]; then
              echo "Desktop is ready!"
              break
            fi
            sleep 2
          done

          echo "::notice title=DESKTOP_URL::$DESKTOP_URL"

          echo "================================================="
          echo "DESKTOP_URL: $DESKTOP_URL"
          echo "USERNAME:    kasm_user"
          echo "================================================="

          sleep 21600
