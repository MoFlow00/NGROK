name: High-Performance Cloud Desktop (WebRTC Gaming)

on:
  workflow_dispatch:

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Kasm WebRTC Desktop
        env:
          VNC_PW: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # تشغيل سطح مكتب Kasm المخصص للألعاب والبث عالي السرعة
          docker run -d \
            --name=kasm-desktop \
            --privileged \
            --shm-size=2gb \
            -p 6901:6901 \
            -e VNC_PW="${VNC_PW:-retro12345}" \
            kasmweb/ubuntu-jammy-desktop:1.15.0

      - name: Start Cloudflare Tunnel & Verification
        run: |
          cloudflared tunnel --no-tls-verify --url https://127.0.0.1:6901 --logfile gaming_tunnel.log &

          echo "Waiting for WebRTC Desktop Tunnel..."
          DESKTOP_URL=""
          for i in {1..30}; do
            DESKTOP_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1 || true)
            if [ -n "$DESKTOP_URL" ]; then
              echo "Desktop is ready!"
              break
            fi
            sleep 2
          done

          echo "::notice title=DESKTOP_URL::$DESKTOP_URL"

          echo "================================================="
          echo "DESKTOP_URL: $DESKTOP_URL"
          echo "================================================="
          sleep 21600
