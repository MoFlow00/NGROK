name: Cloud Retro Gaming (Stable WebRTC)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod -R 777 /home/runner/Games

      - name: Run Kasm Web Engine
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # تشغيل محرك Kasm المستقر والمثبت نجاحه على سيرفرات GitHub
          docker run -d \
            --name=kasm-game-engine \
            --privileged \
            --shm-size=2gb \
            -p 3000:3000 \
            -v /home/runner/Games:/config/Desktop/Games \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/chromium:latest

      - name: Start Cloudflare Tunnel & Verification
        run: |
          cloudflared tunnel --url http://127.0.0.1:3000 --logfile gaming_tunnel.log &

          echo "Waiting for Tunnel to generate URL..."
          GAME_URL=""
          for i in {1..30}; do
            GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1 || true)
            if [ -n "$GAME_URL" ]; then
              echo "Tunnel is ready!"
              break
            fi
            sleep 2
          done

          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
