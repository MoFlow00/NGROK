name: Cloud Retro Gaming (Wine Desktop)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod 777 /home/runner/Games

      - name: Run Web Desktop (Auto-Launch Desktop & File Manager)
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # تشغيل ديسكتوب معزز مع تفعيل التسريع والذاكرة التشاركية
          docker run -d \
            --name=wine-desktop \
            --privileged \
            --shm-size=2gb \
            -p 3000:3000 \
            -v /home/runner/Games:/config/Desktop/Games \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/webtop:ubuntu-mate

          # انتظار الإقلاع ثم فتح النوافذ وسطح المكتب تلقائياً لمنع الشاشة الفارغة
          sleep 10
          docker exec -u 1000 wine-desktop bash -c "DISPLAY=:1 caja /config/Desktop/Games &" || true

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:3000 --logfile gaming_tunnel.log &
          
          # انتظار 10 ثوان لتوليد الرابط والتأكد من جهوزية السيرفر
          sleep 10

          GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1)

          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
