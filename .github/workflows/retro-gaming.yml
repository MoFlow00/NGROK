name: Cloud Retro Gaming (Kasm Native Desktop)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod 777 /home/runner/Games

      - name: Run Official Kasm Ubuntu Desktop (WebRTC Native)
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          docker run -d \
            --name=kasm-desktop \
            --privileged \
            -p 6901:6901 \
            -v /home/runner/Games:/home/kasm-user/Desktop/Games \
            -e VNC_PW="$PASSWORD" \
            -e KASM_USER="$CUSTOM_USER" \
            -e KASM_PASSWORD="$PASSWORD" \
            kasmweb/ubuntu-focal-desktop:1.16.0

      - name: Start Cloudflare Tunnel
        run: |
          # 1. تشغيل النفق وتوجيهه صراحة لـ IPv4
          cloudflared tunnel --no-tls-verify --url https://127.0.0.1:6901 --logfile gaming_tunnel.log &

          # 2. انتظار تشغيل واجهة Kasm بالكامل قبل جلب الرابط
          echo "Waiting for desktop environment to boot..."
          for i in {1..30}; do
            if curl -k -s https://127.0.0.1:6901 > /dev/null; then
              echo "Kasm Desktop is fully ready!"
              break
            fi
            sleep 2
          done

          # 3. استخراج الرابط وطباعته
          GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1)

          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
