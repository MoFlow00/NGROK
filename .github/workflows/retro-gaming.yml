name: Cloud Retro Gaming (Wine Desktop)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod -R 777 /home/runner/Games

      - name: Run Fully Interactive Webtop Desktop
        env:
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          docker run -d \
            --name=wine-desktop \
            --privileged \
            --shm-size=2gb \
            -p 3000:3000 \
            -v /home/runner/Games:/config/Desktop/Games \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="abc" \
            -e PASSWORD="$PASSWORD" \
            -e START_DOCKER=false \
            lscr.io/linuxserver/webtop:ubuntu-mate

      - name: Start Cloudflare Tunnel & Announce
        run: |
          cloudflared tunnel --url http://127.0.0.1:3000 --logfile gaming_tunnel.log &

          # انتظار توليد الرابط بنجاح
          echo "Waiting for Cloudflare Tunnel to generate URL..."
          GAME_URL=""
          for i in {1..20}; do
            GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1 || true)
            if [ -n "$GAME_URL" ]; then
              echo "Tunnel is ready!"
              break
            fi
            sleep 2
          done

          # فتح مدير الملفات ومجلد الألعاب تلقائياً داخل سطح المكتب
          docker exec -u abc wine-desktop bash -c "export DISPLAY=:1; caja /config/Desktop/Games &" || true

          # إرسال الرابط للداشبورد
          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
