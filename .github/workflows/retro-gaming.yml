name: Cloud Retro Gaming (Wine Desktop)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod 777 /home/runner/Games

      - name: Run Web Desktop Container
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # تشغيل واجهة Webtop XFCE كاملة على المنفذ 3000
          docker run -d \
            --name=wine-desktop \
            --privileged \
            --shm-size=2gb \
            -p 3000:3000 \
            -v /home/runner/Games:/config/Games \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            -e TITLE="Cloud Gaming" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Start Cloudflare Tunnel & Verification
        run: |
          # 1. تشغيل النفق على منفذ 3000
          cloudflared tunnel --url http://127.0.0.1:3000 --logfile gaming_tunnel.log &

          # 2. فحص استجابة السيرفر قبل استخراج الرابط
          echo "Waiting for desktop web interface to respond on port 3000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "Desktop web interface is UP and running!"
              break
            fi
            sleep 2
          done

          # 3. استخراج الرابط وإرساله للداشبورد
          GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1)

          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
