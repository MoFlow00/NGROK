name: Cloud Retro Gaming (Wine + WebRTC)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod 777 /home/runner/Games

      - name: Run Low-Latency Wine Gaming Container
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # تشغيل حاوية مخصصة لبيئة Wine وسطح مكتب تفاعلي عالي السرعة
          docker run -d \
            --name=wine-gaming \
            --privileged \
            -p 3000:3000 \
            -v /home/runner/Games:/config/Games \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

          # تثبيت Wine وأدوات تشغيل الـ exe تلقائياً في الخلفية داخل الحاوية
          docker exec -u 0 wine-gaming bash -c "
            dpkg --add-architecture i386 && \
            apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine wine32 wine64 winetricks 7zip wget curl
          " &

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:3000 --logfile gaming_tunnel.log &
          sleep 12

          GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1)

          # إرسال الرابط مباشرة إلى لوحة التحكم
          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
