name: Cloud Retro Gaming (Wine Desktop)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod 777 /home/runner/Games

      - name: Run Clean Webtop XFCE
        env:
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          # تشغيل الحاوية بالمستخدم القياسي المدمج لمنع تعارض الصلاحيات وظهور سطح المكتب فوراً
          docker run -d \
            --name=wine-desktop \
            --privileged \
            --shm-size=2gb \
            -p 3000:3000 \
            -v /home/runner/Games:/config/Desktop/Games \
            -e PUID=1000 \
            -e PGID=1000 \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Start Cloudflare Tunnel & Verification
        run: |
          cloudflared tunnel --url http://127.0.0.1:3000 --logfile gaming_tunnel.log &

          echo "Waiting for UI to render..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              break
            fi
            sleep 2
          done

          GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1)

          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
