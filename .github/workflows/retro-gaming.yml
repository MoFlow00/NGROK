name: Cloud Retro Gaming (Fast & Stable)

on:
  workflow_dispatch:

jobs:
  run-games:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Games Directory
        run: |
          mkdir -p /home/runner/Games
          chmod -R 777 /home/runner/Games

      - name: Run Stable Web Desktop (noVNC Native)
        run: |
          # تشغيل ديسكتوب خفيف بدون كلمات سر معقدة متوافق مباشرة مع الماوس واللابتوب
          docker run -d \
            --name=desktop \
            --privileged \
            --shm-size=2gb \
            -p 8080:8080 \
            -v /home/runner/Games:/root/Desktop/Games \
            -e VNC_PW=password \
            dorowu/ubuntu-desktop-lxde-vnc

      - name: Start Tunnel & Auto Healthcheck
        run: |
          cloudflared tunnel --url http://127.0.0.1:8080 --logfile gaming_tunnel.log &

          echo "Waiting for Tunnel to generate URL..."
          GAME_URL=""
          for i in {1..30}; do
            GAME_URL=$(grep -o 'https://.*\.trycloudflare\.com' gaming_tunnel.log | head -n 1 || true)
            if [ -n "$GAME_URL" ]; then
              echo "Tunnel is ready!"
              break
            fi
            sleep 2
          done

          # إرسال الرابط المباشر للداشبورد
          echo "::notice title=RETRO_GAME_URL::$GAME_URL"

          echo "================================================="
          echo "RETRO_GAME_URL: $GAME_URL"
          echo "================================================="
          sleep 21600
