name: NGROK Cloud RDP

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: true
        type: choice
        options: ["1h", "3h", "6h"]
        default: "6h"

permissions:
  contents: read

jobs:
  desktop:
    name: XFCE4 RDP
    runs-on: ubuntu-latest
    timeout-minutes: 365

    steps:
      - name: Install lightweight XFCE4 + RDP
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfce4 xfce4-terminal xrdp xorgxrdp dbus-x11 curl ca-certificates openssl
          sudo useradd -m -s /bin/bash clouduser || true
          RDP_PASSWORD="\$(openssl rand -hex 10)"
          echo "clouduser:\$RDP_PASSWORD" | sudo chpasswd
          sudo usermod -aG ssl-cert clouduser
          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share
          exec dbus-run-session -- startxfce4
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          systemctl is-active --quiet xrdp
          echo "RDP_PASSWORD=\$RDP_PASSWORD" >> "\$GITHUB_ENV"

      - name: Start Bore TCP tunnel
        run: |
          set -Eeuo pipefail

          RELEASE_JSON="$(curl -fsSL --retry 5 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ekzhang/bore/releases/latest")"

          BORE_URL="$(jq -r '
            .assets[]
            | select(.name | test("x86_64.*unknown-linux-(musl|gnu).*\\.tar\\.gz$"))
            | .browser_download_url
          ' <<< "$RELEASE_JSON" | head -n 1)"

          if [[ -z "$BORE_URL" || "$BORE_URL" == "null" ]]; then
            echo "::error::Could not find an x86_64 Linux Bore release asset."
            jq -r '.assets[].name' <<< "$RELEASE_JSON"
            exit 1
          fi

          echo "Downloading Bore from: $BORE_URL"
          curl -fsSL --retry 5 --retry-all-errors -o "$HOME/bore.tar.gz" "$BORE_URL"

          tar -xzf "$HOME/bore.tar.gz" -C "$HOME"
          BORE_BIN="$(find "$HOME" -maxdepth 3 -type f -name 'bore' -perm -u+x | head -n 1)"

          if [[ -z "$BORE_BIN" ]]; then
            echo "::error::Bore binary was not found after extraction."
            tar -tzf "$HOME/bore.tar.gz" || true
            exit 1
          fi

          chmod +x "$BORE_BIN"

          nohup "$BORE_BIN" local 3389 --to bore.pub > "$HOME/bore-rdp.log" 2>&1 &
          echo $! > "$HOME/bore-rdp.pid"

          PUBLIC_ENDPOINT=""
          for attempt in {1..30}; do
            sleep 2

            if ! kill -0 "$(cat "$HOME/bore-rdp.pid")" 2>/dev/null; then
              cat "$HOME/bore-rdp.log" || true
              echo "::error::Bore tunnel stopped unexpectedly."
              exit 1
            fi

            PUBLIC_ENDPOINT="$(grep -Eo 'bore\.pub:[0-9]+' "$HOME/bore-rdp.log" | head -n 1 || true)"
            if [[ -n "$PUBLIC_ENDPOINT" ]]; then
              break
            fi
          done

          if [[ -z "$PUBLIC_ENDPOINT" ]]; then
            echo "::error::Bore did not provide a public TCP endpoint."
            cat "$HOME/bore-rdp.log" || true
            exit 1
          fi

          echo "PUBLIC_ENDPOINT=$PUBLIC_ENDPOINT" >> "$GITHUB_ENV"

          {
            echo "### NGROK CLOUD RDP"
            echo
            echo "RDP Host     : $PUBLIC_ENDPOINT"
            echo "Username     : clouduser"
            echo "Password     : $RDP_PASSWORD"
            echo
            echo "Connect directly with Microsoft Remote Desktop to: $PUBLIC_ENDPOINT"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================"
          echo "NGROK CLOUD RDP IS READY"
          echo "RDP Host     : $PUBLIC_ENDPOINT"
          echo "Username     : clouduser"
          echo "Password     : $RDP_PASSWORD"
          echo "========================================"

      - name: Verify RDP listener
        run: |
          set -Eeuo pipefail
          sudo ss -lntp | grep ':3389' || {
            echo "::error::xrdp is not listening on port 3389."
            exit 1
          }
          ps aux | grep -E 'xrdp|Xorg' | grep -v grep || true
          echo "Bore endpoint: \$PUBLIC_ENDPOINT"

      - name: Keep session alive
        run: |
          case "\${{ inputs.duration || '6h' }}" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            6h) sleep 21600 ;;
            *) echo "::error::Invalid duration"; exit 1 ;;
          esac

      - name: Diagnostics
        if: failure()
        run: |
          ps aux | grep -E "xfce|xrdp|Xorg|bore" | grep -v grep || true
          sudo journalctl -u xrdp --no-pager -n 100 2>/dev/null || true
          cat "\$HOME/bore-rdp.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f bore >/dev/null 2>&1 || true
          pkill -f xrdp >/dev/null 2>&1 || true
          pkill -f xfce4 >/dev/null 2>&1 || true
          pkill -f Xorg >/dev/null 2>&1 || true
