name: Linux Wine Game Lab

on:
  workflow_dispatch:

jobs:
  wine-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Prepare Downloads Directory
        run: |
          mkdir -p /home/runner/Downloads
          chmod 777 /home/runner/Downloads

      - name: Start Ubuntu XFCE Desktop
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          docker run -d \
            --name=wine-lab \
            --privileged \
            --shm-size=1gb \
            -p 3000:3000 \
            -v /home/runner/Downloads:/config/Downloads \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Install Wine, Winetricks and 32-bit Support
        run: |
          docker exec wine-lab bash -lc '
            dpkg --add-architecture i386
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              wine \
              wine32 \
              wine64 \
              winetricks \
              cabextract \
              p7zip-full \
              unzip \
              curl \
              wget \
              file
          '

      - name: Install Chromium in the Desktop
        run: |
          docker exec -u 1000 -e HOME=/config wine-lab bash -lc '
            proot-apps install chromium || proot-apps install firefox
          '

      - name: Initialize Wine Environment
        run: |
          docker exec -u 1000 -e HOME=/config wine-lab bash -lc '
            export DISPLAY=:0
            export WINEPREFIX=/config/.wine
            wineboot --init || true
            mkdir -p /config/Games /config/Downloads
          '

      - name: Create Wine Lab Info
        run: |
          docker exec wine-lab bash -lc '
            cat > /config/Downloads/WINE-LAB-README.txt <<'EOF'
CloudRunner Wine Game Lab

Downloads: /config/Downloads
Games:     /config/Games

Run a Windows EXE from the terminal:
  wine /config/Downloads/game.exe

Wine prefix:
  /config/.wine

Useful commands:
  winecfg
  winetricks
  wineboot --init
EOF
          '

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:3000 --logfile wine_tunnel.log &

          for i in {1..30}; do
            WINE_URL=$(grep -o 'https://.*\.trycloudflare\.com' wine_tunnel.log | head -n 1 || true)
            if [ -n "$WINE_URL" ]; then break; fi
            sleep 2
          done

          echo "::notice title=WINE_LAB_URL::$WINE_URL"
          echo "================================================="
          echo "WINE LAB: $WINE_URL"
          echo "================================================="

          if [ -z "$WINE_URL" ]; then
            echo "Cloudflare tunnel URL was not detected. Check wine_tunnel.log."
            exit 1
          fi

      - name: Keep Session Alive
        run: |
          sleep 21600
