name: Linux Wine Game Lab

on:
  workflow_dispatch:

jobs:
  wine-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Prepare Downloads Directory
        run: |
          mkdir -p /home/runner/Downloads
          chmod 777 /home/runner/Downloads

      - name: Start Ubuntu XFCE Desktop
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          docker run -d \
            --name=wine-lab \
            --privileged \
            --shm-size=1gb \
            -p 3000:3000 \
            -v /home/runner/Downloads:/config/Downloads \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Install Wine and 32-bit Support
        run: |
          docker exec wine-lab bash -lc 'dpkg --add-architecture i386'
          docker exec wine-lab bash -lc 'apt-get update'
          docker exec wine-lab bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get install -y wine64 wine32:i386 winetricks cabextract p7zip-full unzip curl wget file'

      - name: Install Chromium
        run: |
          docker exec wine-lab bash -lc 'command -v chromium >/dev/null 2>&1 || (apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y chromium)'

      - name: Initialize Wine Environment
        run: |
          docker exec -u 1000 -e HOME=/config wine-lab bash -lc 'export DISPLAY=:0; export WINEPREFIX=/config/.wine; mkdir -p /config/Games /config/Downloads; wineboot --init'

      - name: Create Game Launcher Helper
        run: |
          docker exec wine-lab bash -lc 'printf "%s\n" "#!/bin/bash" "export DISPLAY=:0" "export WINEPREFIX=/config/.wine" "wine \"$1\"" > /config/wine-run.sh && chmod +x /config/wine-run.sh'

      - name: Create Lab Info
        run: |
          docker exec wine-lab bash -lc 'printf "%s\n" "CloudRunner Wine Game Lab" "" "Downloads: /config/Downloads" "Games: /config/Games" "" "Run a Windows EXE:" "wine /config/Downloads/game.exe" "" "Wine prefix: /config/.wine" "" "Tools: winecfg, winetricks, wineboot" > /config/Downloads/WINE-LAB-README.txt'

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:3000 --logfile wine_tunnel.log &
          for i in {1..30}; do
            WINE_URL=$(grep -o 'https://.*\.trycloudflare\.com' wine_tunnel.log | head -n 1 || true)
            if [ -n "$WINE_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$WINE_URL" ]; then
            echo "Cloudflare tunnel URL was not detected."
            cat wine_tunnel.log || true
            exit 1
          fi
          echo "::notice title=WINE_LAB_URL::$WINE_URL"
          echo "================================================="
          echo "WINE LAB: $WINE_URL"
          echo "================================================="

      - name: Keep Session Alive
        run: |
          sleep 21600
