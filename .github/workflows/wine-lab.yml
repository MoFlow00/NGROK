name: Linux Wine Game Lab

on:
  workflow_dispatch:

jobs:
  wine-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Selkies Desktop
        env:
          SELKIES_USER: ${{ secrets.BROWSER_USER }}
          SELKIES_PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          mkdir -p /home/runner/Downloads
          docker run -d \
            --name=wine-lab \
            --privileged \
            --shm-size=2g \
            -p 8080:8080 \
            -v /home/runner/Downloads:/home/ubuntu/Downloads \
            -e SELKIES_BASIC_AUTH_USER="$SELKIES_USER" \
            -e SELKIES_BASIC_AUTH_PASSWORD="$SELKIES_PASSWORD" \
            -e SELKIES_ENABLE_HTTPS=false \
            -e SELKIES_MODE=websocket \
            -e SELKIES_ENCODER=h264enc \
            -e SELKIES_FRAMERATE=60 \
            -e SELKIES_ENABLE_RESIZE=true \
            ghcr.io/selkies-project/selkies/desktop:main-ubuntu26.04

      - name: Wait For Selkies
        run: |
          echo "Waiting for Selkies desktop..."
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Selkies is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Install Wine and Game Tools
        run: |
          docker exec wine-lab bash -lc 'dpkg --add-architecture i386'
          docker exec wine-lab bash -lc 'apt-get update'
          docker exec wine-lab bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get install -y wine64 wine32:i386 winetricks cabextract p7zip-full unzip file'

      - name: Prepare Game Folders
        run: |
          docker exec wine-lab bash -lc 'mkdir -p /home/ubuntu/Downloads/Games /home/ubuntu/Games'
          docker exec wine-lab bash -lc 'chown -R ubuntu:ubuntu /home/ubuntu/Downloads /home/ubuntu/Games'

      - name: Create Game Helper
        run: |
          docker exec wine-lab bash -lc 'printf "%s\n" \
            "CloudRunner Wine Game Lab" \
            "" \
            "Downloads: /home/ubuntu/Downloads" \
            "Games: /home/ubuntu/Games" \
            "" \
            "To run an EXE:" \
            "wine /home/ubuntu/Downloads/game.exe" \
            "" \
            "Useful commands: winecfg, winetricks, wineboot" \
            > /home/ubuntu/Downloads/WINE-LAB-README.txt'
          docker exec wine-lab bash -lc 'chown ubuntu:ubuntu /home/ubuntu/Downloads/WINE-LAB-README.txt'

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8080 --logfile wine_tunnel.log &
          for i in {1..60}; do
            WINE_URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' wine_tunnel.log | head -n 1 || true)
            if [ -n "$WINE_URL" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$WINE_URL" ]; then
            cat wine_tunnel.log || true
            exit 1
          fi
          echo "::notice title=WINE_LAB_URL::$WINE_URL"
          echo "================================================="
          echo "WINE LAB: $WINE_URL"
          echo "================================================="

      - name: Keep Session Alive
        run: |
          sleep 21600
