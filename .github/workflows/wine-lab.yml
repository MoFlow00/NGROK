name: Linux Wine Game Lab

on:
  workflow_dispatch:

jobs:
  wine-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Webtop Desktop
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          mkdir -p /home/runner/CloudRunner
          docker run -d \
            --name=wine-lab \
            --privileged \
            --shm-size=2gb \
            -p 3000:3000 \
            -v /home/runner/CloudRunner:/config/CloudRunner \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            -e TITLE=CloudRunner-Wine-Lab \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Wait for Desktop
        run: |
          for i in {1..60}; do
            if docker exec wine-lab bash -lc 'test -S /tmp/.X11-unix/X0'; then
              echo "X11 is ready"
              break
            fi
            sleep 2
          done
          docker exec wine-lab bash -lc 'test -S /tmp/.X11-unix/X0'

      - name: Install Wine and Game Tools
        run: |
          docker exec wine-lab bash -lc 'dpkg --add-architecture i386'
          docker exec wine-lab bash -lc 'apt-get update'
          docker exec wine-lab bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get install -y wine64 wine32:i386 winetricks cabextract p7zip-full unzip curl wget file'

      - name: Install Chromium
        run: |
          docker exec wine-lab bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y chromium'
          docker exec wine-lab bash -lc 'command -v chromium'

      - name: Prepare Game Lab
        run: |
          docker exec wine-lab bash -lc 'mkdir -p /config/CloudRunner/Games /config/CloudRunner/Downloads /config/Desktop /config/.config/autostart /tmp/runtime-user'
          docker exec wine-lab bash -lc 'chown -R 1000:1000 /config/CloudRunner /config/Desktop /config/.config /tmp/runtime-user'
          docker exec wine-lab bash -lc 'chmod 700 /tmp/runtime-user'

      - name: Initialize Wine
        continue-on-error: true
        run: |
          docker exec -u 1000 -e HOME=/config -e DISPLAY=:0 -e XDG_RUNTIME_DIR=/tmp/runtime-user wine-lab bash -lc 'export WINEPREFIX=/config/.wine; wineboot --init'

      - name: Add Chromium Autostart
        run: |
          docker exec wine-lab bash -lc 'cat > /config/.config/autostart/chromium.desktop <<"EOF"
          [Desktop Entry]
          Type=Application
          Name=Chromium
          Exec=chromium --no-sandbox --start-maximized
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF
          chown 1000:1000 /config/.config/autostart/chromium.desktop'

      - name: Add Desktop Shortcuts
        run: |
          docker exec wine-lab bash -lc 'cat > /config/Desktop/Chromium.desktop <<"EOF"
          [Desktop Entry]
          Type=Application
          Name=Chromium Browser
          Exec=chromium --no-sandbox %U
          Terminal=false
          Categories=Network;WebBrowser;
          EOF
          chmod +x /config/Desktop/Chromium.desktop
          chown 1000:1000 /config/Desktop/Chromium.desktop'

          docker exec wine-lab bash -lc 'cat > /config/Desktop/Wine-Terminal.desktop <<"EOF"
          [Desktop Entry]
          Type=Application
          Name=Wine Game Terminal
          Exec=xfce4-terminal
          Terminal=false
          Categories=System;
          EOF
          chmod +x /config/Desktop/Wine-Terminal.desktop
          chown 1000:1000 /config/Desktop/Wine-Terminal.desktop'

      - name: Add Wine Game Launcher
        run: |
          docker exec wine-lab bash -lc 'cat > /usr/share/applications/wine-game-lab.desktop <<"EOF"
          [Desktop Entry]
          Type=Application
          Name=Wine Game Lab
          Comment=Run Windows EXE files with Wine
          Exec=xfce4-terminal -e "bash -lc \"export WINEPREFIX=/config/.wine; wine /config/CloudRunner/Downloads/game.exe; exec bash\""
          Terminal=false
          Categories=Game;Utility;
          EOF
          chmod 644 /usr/share/applications/wine-game-lab.desktop
          update-desktop-database /usr/share/applications 2>/dev/null || true'

      - name: Refresh XFCE Menu
        run: |
          docker exec -u 1000 -e HOME=/config wine-lab bash -lc 'xfdesktop --reload 2>/dev/null || true'
          docker exec -u 1000 -e HOME=/config wine-lab bash -lc 'xfce4-panel -r 2>/dev/null || true'

      - name: Start Chromium
        run: |
          docker exec -u 1000 -e HOME=/config -e DISPLAY=:0 -e XDG_RUNTIME_DIR=/tmp/runtime-user wine-lab bash -lc 'pkill -u 1000 chromium || true; nohup chromium --no-sandbox --start-maximized >/config/chromium.log 2>&1 &'

      - name: Create Game Lab README
        run: |
          docker exec wine-lab bash -lc 'cat > /config/CloudRunner/Downloads/WINE-LAB-README.txt <<"EOF"
          CloudRunner Wine Game Lab

          Downloads: /config/CloudRunner/Downloads
          Games: /config/CloudRunner/Games
          Wine prefix: /config/.wine

          Run an EXE:
          wine /config/CloudRunner/Downloads/game.exe

          Useful commands:
          winecfg
          winetricks
          wineboot
          EOF
          chown 1000:1000 /config/CloudRunner/Downloads/WINE-LAB-README.txt'

      - name: Start Cloudflare Tunnel
        run: |
          touch wine_tunnel.log
          cloudflared tunnel --url http://localhost:3000 --logfile wine_tunnel.log &
          for i in {1..30}; do
            WINE_URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' wine_tunnel.log | head -n 1 || true)
            if [ -n "$WINE_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$WINE_URL" ]; then
            echo "Cloudflare tunnel URL was not detected."
            cat wine_tunnel.log || true
            exit 1
          fi
          echo "::notice title=WINE_LAB_URL::$WINE_URL"
          echo "WINE LAB: $WINE_URL"

      - name: Keep Session Alive
        run: sleep 21600
