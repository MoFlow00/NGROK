name: Linux Wine Game Lab

on:
  workflow_dispatch:

jobs:
  wine-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Selkies Desktop
        env:
          SELKIES_USER: ${{ secrets.BROWSER_USER }}
          SELKIES_PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          mkdir -p /home/runner/Downloads
          docker run -d \
            --name=wine-lab \
            --privileged \
            --security-opt seccomp=unconfined \
            --shm-size=2gb \
            -p 8080:8080 \
            -v /home/runner/Downloads:/config/Downloads \
            -e SELKIES_BASIC_AUTH_USER="$SELKIES_USER" \
            -e SELKIES_BASIC_AUTH_PASSWORD="$SELKIES_PASSWORD" \
            -e SELKIES_MODE=webrtc \
            -e SELKIES_ENABLE_DUAL_MODE=true \
            -e SELKIES_CONGESTION_CONTROL=true \
            -e SELKIES_ENCODER=x264enc \
            -e SELKIES_FRAMERATE=60 \
            -e SELKIES_H264_CRF=20 \
            -e SELKIES_H264_STREAMING_MODE=true \
            -e SELKIES_H264_FULLCOLOR=true \
            -e SELKIES_USE_PAINT_OVER_QUALITY=true \
            ghcr.io/selkies-project/selkies/desktop:main-ubuntu26.04

      - name: Wait For Selkies
        env:
          SELKIES_USER: ${{ secrets.BROWSER_USER }}
          SELKIES_PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          echo "Waiting for Selkies desktop..."
          for i in {1..90}; do
            if curl -fsS -u "$SELKIES_USER:$SELKIES_PASSWORD" http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Selkies is ready"
              break
            fi
            sleep 2
          done
          curl -fsS -u "$SELKIES_USER:$SELKIES_PASSWORD" http://127.0.0.1:8080/ >/dev/null

      - name: Install Wine and Game Tools
        run: |
          docker exec wine-lab bash -lc 'dpkg --add-architecture i386'
          docker exec wine-lab bash -lc 'apt-get update'
          docker exec wine-lab bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get install -y wine64 wine32:i386 winetricks cabextract p7zip-full unzip curl wget file'

      - name: Prepare Game Folders
        run: |
          docker exec wine-lab bash -lc 'mkdir -p /config/Games /config/Downloads'
          docker exec wine-lab bash -lc 'chown -R 1000:1000 /config/Games /config/Downloads 2>/dev/null || true'

      - name: Initialize Wine
        run: |
          docker exec wine-lab bash -lc 'export DISPLAY=:0; export WINEPREFIX=/config/.wine; wineboot --init || true'

      - name: Create Game Launcher
        run: |
          docker exec wine-lab bash -lc 'mkdir -p /config/Desktop'
          docker exec wine-lab bash -lc 'printf "%s\\n" "[Desktop Entry]" "Type=Application" "Name=Wine Game Terminal" "Comment=Run Windows EXE games with Wine" "Exec=xfce4-terminal" "Icon=utilities-terminal" "Terminal=false" "Categories=Game;Utility;" > /config/Desktop/Wine-Game-Terminal.desktop && chmod +x /config/Desktop/Wine-Game-Terminal.desktop && chown 1000:1000 /config/Desktop/Wine-Game-Terminal.desktop'
          docker exec wine-lab bash -lc 'printf "%s\\n" "CloudRunner Wine Game Lab" "" "Downloads: /config/Downloads" "Games: /config/Games" "Wine prefix: /config/.wine" "" "Run an EXE:" "  wine /config/Downloads/game.exe" "" "Useful:" "  winecfg" "  winetricks" "  wineboot" > /config/Downloads/WINE-LAB-README.txt && chown 1000:1000 /config/Downloads/WINE-LAB-README.txt'

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://127.0.0.1:8080 --logfile wine_tunnel.log &
          for i in {1..60}; do
            WINE_URL=$(grep -o 'https://.*\.trycloudflare\.com' wine_tunnel.log | head -n 1 || true)
            if [ -n "$WINE_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$WINE_URL" ]; then
            cat wine_tunnel.log || true
            exit 1
          fi
          echo "::notice title=WINE_LAB_URL::$WINE_URL"
          echo "================================================="
          echo "WINE LAB: $WINE_URL"
          echo "================================================="

      - name: Keep Session Alive
        run: |
          sleep 21600
