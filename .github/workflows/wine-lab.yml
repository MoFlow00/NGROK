name: Linux Wine Game Lab

on:
  workflow_dispatch:

jobs:
  wine-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Ubuntu XFCE Desktop
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          mkdir -p /home/runner/Downloads
          docker run -d \
            --name=wine-lab \
            --privileged \
            --security-opt seccomp=unconfined \
            --shm-size=2gb \
            -p 3000:3000 \
            -v /home/runner/Downloads:/config/Downloads \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            -e TITLE=CloudRunner-Wine-Lab \
            -e START_DOCKER=true \
            -e PIXELFLUX_WAYLAND=false \
            -e PIXELFLUX_ENCODER=h264 \
            -e PIXELFLUX_FPS=60 \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Install Wine and Game Tools
        run: |
          docker exec wine-lab bash -lc 'dpkg --add-architecture i386'
          docker exec wine-lab bash -lc 'apt-get update'
          docker exec wine-lab bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get install -y wine64 wine32:i386 winetricks cabextract p7zip-full unzip curl wget file'

      - name: Install Chromium Browser
        run: |
          docker exec wine-lab bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y chromium'
          docker exec wine-lab bash -lc 'command -v chromium'

      - name: Prepare Game Lab Directories
        run: |
          docker exec wine-lab bash -lc 'mkdir -p /config/Games /config/Downloads /config/Desktop'
          docker exec wine-lab bash -lc 'chown -R 1000:1000 /config/Games /config/Downloads /config/Desktop'

      - name: Initialize Wine Environment
        run: |
          docker exec -u 1000 -e HOME=/config wine-lab bash -lc 'export DISPLAY=:0; export WINEPREFIX=/config/.wine; wineboot --init'

      - name: Repair XFCE Session
        run: |
          for i in {1..30}; do
            if docker exec wine-lab bash -lc 'test -S /tmp/.X11-unix/X0'; then
              break
            fi
            sleep 2
          done
          docker exec -u 1000 -e HOME=/config -e DISPLAY=:0 wine-lab bash -lc '
            pkill -u 1000 xfce4-panel || true
            pkill -u 1000 xfdesktop || true
            pkill -u 1000 xfwm4 || true
            nohup xfwm4 --replace >/config/xfwm4.log 2>&1 &
            sleep 2
            nohup xfdesktop --replace >/config/xfdesktop.log 2>&1 &
            sleep 2
            nohup xfce4-panel >/config/xfce4-panel.log 2>&1 &
          '

      - name: Add Desktop Shortcuts
        run: |
          docker exec wine-lab bash -lc 'cat > /config/Desktop/Chromium.desktop <<"EOF"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Chromium Browser
          Comment=CloudRunner web browser
          Exec=chromium --no-sandbox %U
          Icon=chromium
          Terminal=false
          Categories=Network;WebBrowser;
          EOF
          chmod +x /config/Desktop/Chromium.desktop
          chown 1000:1000 /config/Desktop/Chromium.desktop'

          docker exec wine-lab bash -lc 'cat > /config/Desktop/Wine-Terminal.desktop <<"EOF"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Wine Game Terminal
          Comment=Open a terminal for running Windows games with Wine
          Exec=xfce4-terminal
          Icon=utilities-terminal
          Terminal=false
          Categories=System;
          EOF
          chmod +x /config/Desktop/Wine-Terminal.desktop
          chown 1000:1000 /config/Desktop/Wine-Terminal.desktop'

      - name: Add Wine Tools to Applications Menu
        run: |
          docker exec wine-lab bash -lc 'cat > /usr/share/applications/wine-game-lab.desktop <<"EOF"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Wine Game Lab
          Comment=Run Windows EXE files with Wine
          Exec=xfce4-terminal --command="bash -lc \"export DISPLAY=:0; export WINEPREFIX=/config/.wine; echo Wine Game Lab; echo; echo Run: wine /config/Downloads/game.exe; exec bash\""
          Icon=wine
          Terminal=false
          Categories=Utility;Game;
          EOF
          update-desktop-database /usr/share/applications 2>/dev/null || true'

      - name: Launch Chromium Automatically
        run: |
          sleep 3
          docker exec -u 1000 -e HOME=/config -e DISPLAY=:0 wine-lab bash -lc 'nohup chromium --no-sandbox --start-maximized >/config/chromium.log 2>&1 &'

      - name: Create Lab Info
        run: |
          docker exec wine-lab bash -lc 'printf "%s\n" \
            "CloudRunner Wine Game Lab" \
            "" \
            "Downloads: /config/Downloads" \
            "Games:     /config/Games" \
            "Wine prefix: /config/.wine" \
            "" \
            "Run a Windows EXE:" \
            "wine /config/Downloads/game.exe" \
            "" \
            "Useful tools: winecfg, winetricks, wineboot" \
            > /config/Downloads/WINE-LAB-README.txt'
          docker exec wine-lab bash -lc 'chown 1000:1000 /config/Downloads/WINE-LAB-README.txt'

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:3000 --logfile wine_tunnel.log &
          for i in {1..30}; do
            WINE_URL=$(grep -o 'https://.*\.trycloudflare\.com' wine_tunnel.log | head -n 1 || true)
            if [ -n "$WINE_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$WINE_URL" ]; then
            echo "Cloudflare tunnel URL was not detected."
            cat wine_tunnel.log || true
            exit 1
          fi
          echo "::notice title=WINE_LAB_URL::$WINE_URL"
          echo "================================================="
          echo "WINE LAB: $WINE_URL"
          echo "================================================="

      - name: Keep Session Alive
        run: |
          sleep 21600
