name: Super Smooth Cloud Browser (Kasm WebRTC)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Run Kasm Chromium (WebRTC 60FPS)
        run: |
          docker run -d \
            --name=kasm-chromium \
            -p 3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e CUSTOM_USER=admin \
            -e PASSWORD=admin \
            lscr.io/linuxserver/chromium:latest

      - name: Launch Tunnel
        run: |
          cloudflared tunnel --url http://localhost:3000 --logfile cloudflared.log &
          sleep 6
          echo "================================================="
          echo "Your Smooth Cloud Browser Link:"
          grep -o 'https://.*\.trycloudflare.com' cloudflared.log | head -n 1
          echo "Username: admin"
          echo "Password: admin"
          echo "================================================="
          sleep 21600
