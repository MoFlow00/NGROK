name: Android RD Client Ubuntu

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP user password'
        required: true
        default: 'P@ssword1234'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop & XRDP
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies xrdp
          echo xfce4-session > ~/.xsession
          sudo systemctl restart xrdp

      - name: Set Password
        run: |
          echo "runner:${{ github.event.inputs.rdp_password }}" | sudo chpasswd

      - name: Start TCP Tunnel (Bore)
        run: |
          wget -qO- https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          ./bore local 3389 --to bore.pub > bore.log 2>&1 &
          sleep 5
          echo "================================================="
          echo "Connect Details for RD Client Android:"
          echo "PC Name: $(grep -o 'bore.pub:[0-9]*' bore.log | head -n 1)"
          echo "Username: runner"
          echo "Password: ${{ github.event.inputs.rdp_password }}"
          echo "================================================="
          cat bore.log
          sleep 21600
