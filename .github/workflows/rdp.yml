name: Free Ubuntu RDP (No Card)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP user password'
        required: true
        default: 'P@ssword1234'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop & XRDP
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies xrdp websockify
          echo xfce4-session > ~/.xsession
          sudo systemctl restart xrdp

      - name: Setup User Password
        run: |
          echo "runner:${{ github.event.inputs.rdp_password }}" | sudo chpasswd

      - name: Install Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Web RDP & Cloudflare Tunnel
        run: |
          # تشغيل Web RDP للوصول مباشرة من المتصفح بدون برامج خارجية
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          git clone https://github.com/novnc/websockify /tmp/novnc/utils/websockify
          sudo apt install -y x11vnc
          x11vnc -display :0 -autoport -localhost -nopw -bg -forever &
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          
          # فتح النفق المجاني عبر Cloudflare
          cloudflared tunnel --url http://localhost:6080 --logfile cloudflared.log &
          sleep 6
          echo "================================================="
          echo "Your Web RDP Link:"
          grep -o 'https://.*\.trycloudflare.com' cloudflared.log | head -n 1
          echo "================================================="
          sleep 21600
