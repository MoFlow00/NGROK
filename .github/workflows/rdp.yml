name: Free Ubuntu Web RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop, VNC and noVNC
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies tightvncserver novnc websockify

      - name: Start VNC Server
        run: |
          mkdir -p ~/.vnc
          echo "123456" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          # تشغيل الشاشة الوهمية والواجهة
          vncserver :1 -geometry 1280x720 -depth 24
          # تشغيل محول الويب noVNC
          websockify -D --web=/usr/share/novnc/ 6080 localhost:5901

      - name: Install Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Launch Tunnel and Output Link
        run: |
          cloudflared tunnel --url http://localhost:6080 --logfile cloudflared.log &
          sleep 7
          echo "================================================="
          echo "Open this Link in your Browser:"
          grep -o 'https://.*\.trycloudflare.com' cloudflared.log | head -n 1
          echo "Password is: 123456"
          echo "================================================="
          sleep 21600
