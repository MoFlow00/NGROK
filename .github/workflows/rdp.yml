name: Ubuntu Native RDP (For Windows App)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Set RDP user password'
        required: true
        default: 'P@ssword1234'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install XFCE & XRDP
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies xrdp
          echo xfce4-session > ~/.xsession
          sudo systemctl restart xrdp

      - name: Set Password
        run: |
          echo "runner:${{ github.event.inputs.rdp_password }}" | sudo chpasswd

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start TCP Tunnel
        run: |
          cloudflared tunnel --url tcp://localhost:3389 --logfile tunnel.log &
          sleep 7
          echo "================================================="
          echo "Cloudflare Tunnel Host:"
          grep -o 'https://.*\.trycloudflare.com' tunnel.log | sed 's|https://||' | head -n 1
          echo "================================================="
          sleep 21600
