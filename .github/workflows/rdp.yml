name: Cloud Browser + VLC Media Stream (Public Safe)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools & Cloudflared
        run: |
          sudo apt update && sudo apt install -y python3
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Shared Downloads Directory
        run: |
          mkdir -p /home/runner/Downloads
          chmod 777 /home/runner/Downloads

      - name: Run Kasm Chromium (WebRTC Secure)
        env:
          CUSTOM_USER: ${{ secrets.BROWSER_USER }}
          PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          docker run -d \
            --name=kasm-chromium \
            -p 3000:3000 \
            -v /home/runner/Downloads:/config/Downloads \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_USER="$CUSTOM_USER" \
            -e PASSWORD="$PASSWORD" \
            lscr.io/linuxserver/chromium:latest

      - name: Start VLC Stream Server & Dual Tunnels
        run: |
          # 1. تشغيل سيرفر الملفات للبث المباشر
          cd /home/runner/Downloads
          python3 -m http.server 8080 &

          # 2. تشغيل الأنفاق
          cloudflared tunnel --url http://localhost:3000 --logfile browser_tunnel.log &
          cloudflared tunnel --url http://localhost:8080 --logfile vlc_tunnel.log &

          sleep 8

          BROWSER_URL=$(grep -o 'https://.*\.trycloudflare\.com' browser_tunnel.log | head -n 1)
          VLC_URL=$(grep -o 'https://.*\.trycloudflare\.com' vlc_tunnel.log | head -n 1)

          # إرسال الرابطين إلى الداشبورد مباشرة
          echo "::notice title=Browser Link::$BROWSER_URL"
          echo "::notice title=VLC Stream Link::$VLC_URL"

          echo "================================================="
          echo "1. Cloud Browser Link: $BROWSER_URL"
          echo ""
          echo "2. VLC Streaming Directory Link: $VLC_URL"
          echo "================================================="
          sleep 21600
